<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="bot-open-relay" content="1">
<title>開く</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, sans-serif; margin: 0; padding: 24px 16px; line-height: 1.6; background: Canvas; color: CanvasText; }
  a.btn { display: block; text-align: center; padding: 18px; border-radius: 14px; background: #0a84ff; color: #fff; font-size: 20px; font-weight: 600; text-decoration: none; margin: 16px 0; }
  .note { font-size: 14px; opacity: .7; }
  .err { color: #d70015; font-weight: 600; }
</style>
</head>
<body>
<p id="msg">開いています…</p>
<a class="btn" id="go" href="#">Scriptable で開く</a>
<p class="note" id="st"></p>
<script>
(function () {
  var SCRIPT = "BotHTML";
  var q = new URLSearchParams(location.search);
  var f = q.get("f") || "";
  var ok = /^[a-z0-9][a-z0-9_-]{0,39}(\/[A-Za-z0-9_-]{1,40})?\/[A-Za-z0-9][A-Za-z0-9_-]{0,119}\.html$/.test(f);
  var msg = document.getElementById("msg"), go = document.getElementById("go"), st = document.getElementById("st");
  if (!ok) {
    msg.className = "err";
    msg.textContent = "リンクの形が正しくありません。";
    go.style.display = "none";
  } else {
    var url = "scriptable:///run/" + encodeURIComponent(SCRIPT) + "?file=" + encodeURIComponent(f);
    go.href = url;
    msg.textContent = f + " を開きます。";
  }
  st.textContent = navigator.onLine ? "通信：あり" : "通信：なし（保存済みのページで動いています）";
  // 保存（サービスワーカー）の準備を最大0.8秒待ってから移る。初めて開いたときにも保存が終わるようにするため
  var moved = false;
  function go2() { if (ok && !moved) { moved = true; location.href = go.href; } }
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").then(function () {
      st.textContent += "／保存：有効";
      return navigator.serviceWorker.ready;
    }).then(go2).catch(function () {
      st.textContent += "／保存：使えない";
      go2();
    });
  } else {
    st.textContent += "／保存：この画面では使えない";
  }
  setTimeout(go2, 800);
})();
</script>
</body>
</html>
